name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.24.x', 'stable']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Verify dependencies
        run: go mod verify
      - name: Static analysis
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test with race detection and coverage
        run: go test -race -shuffle=on -count=1 -timeout=5m -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
      - name: Test coverage checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Enforce coverage thresholds
        run: |
          python3 scripts/check-coverage.py coverage.out | tee coverage-summary.txt
          cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Generate coverage report
        if: always()
        run: |
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o coverage.html
          fi
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.go }}
          path: |
            coverage.out
            coverage.html
            coverage-summary.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Check generated SDK and documentation
        if: matrix.go == '1.24.x'
        run: |
          go generate ./...
          go run ./internal/docgen
          git diff --exit-code
          test -z "$(git ls-files --others --exclude-standard -- api.gen.go docs)"
